! Configuration File for keepalived on gw1 (PRIMARY MASTER)

global_defs {
    router_id gw1_node
    enable_script_security
    script_user root
}

vrrp_script check_haproxy {
    # pidof haproxy returns 0 if running, non-zero if stopped
    script "/usr/bin/pidof haproxy"
    interval 1
    fall 2
    rise 2
    weight -20      # On failure: priority drops from 101 to 81 (< gw2 priority of 90)
}

vrrp_instance VI_FELCLOUD {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 101
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass FelCloudHA2026!
    }

    virtual_ipaddress {
        # Virtual IP (VIP) shared between gw1 and gw2
        10.0.0.5/24 dev eth0 label eth0:vip
    }

    track_script {
        check_haproxy
    }
}
